# =============================================================================
#  Apple App Store Connect → BigQuery Sync                          (v3.0)
#  repo: bigquery-terafort/apple_store_connect
#  path: .github/workflows/apple_sync.yml
# =============================================================================
#  v2.0 SE KYA BADLA — 5 FIXES:
#
#   1. 🔴 TIMEOUT 60 → 150 MINUTES
#      Run #181 ne 37m 35s liye THE RETRIES SE PEHLE. v4 script har HTTP
#      call par 3 retries lagati hai (backoff ke saath) — ek bura din
#      aasani se 60 min cross kar sakta hai aur job beech mein kat jati.
#
#   2. 🆕 RETRY KNOBS env se
#      HTTP_RETRIES / HTTP_BACKOFF / SEGMENT_TIMEOUT / API_TIMEOUT
#      Ab bina code chhue tune ho sakte hain.
#
#   3. 🆕 EXIT CODE 1 KA MATLAB BADAL GAYA
#      v3 script: 1 = "kuch load nahi hua" (poora run zaya)
#      v4 script: 1 = "kuch app/table chhoot gaye, BAQI SAB LOAD HO GAYA"
#      Is liye health check ab `if: always()` par bhi asli row counts
#      dikhata hai — red X ka matlab ab data-loss NAHI hai.
#
#   4. 🆕 HEALTH CHECK MEIN FRESHNESS
#      Sirf row count nahi — har analytics table ka MAX(date) bhi, taake
#      "table bhari hui hai magar 6 din purani" chhup na sake.
#
#   5. Baqi v2 jaisa: keepalive job, concurrency guard, BQ_DATASET var.
#
#  SECRETS: APPLE_KEY_ID · APPLE_ISSUER_ID · APPLE_PRIVATE_KEY ·
#           APPLE_VENDOR_NUMBER · GCP_PROJECT · GCP_CREDENTIALS_JSON
# =============================================================================
name: Apple App Store Connect → BigQuery Sync

on:
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC = 12:00 PKT (Apple reports ban chuki hoti hain)
  workflow_dispatch:
    inputs:
      sales_lookback_days:
        description: "Sales ke kitne din kheenchein"
        default: "21"
      finance_lookback_months:
        description: "Finance ke kitne mahine"
        default: "6"
      http_retries:
        description: "Har HTTP call par kitni retries (default 3)"
        default: "3"
      segment_timeout:
        description: "S3 segment download timeout, seconds (default 300)"
        default: "300"

permissions:
  contents: write                # keepalive commit ke liye

concurrency:
  group: apple-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Apple App Store Connect Data to BigQuery
    runs-on: ubuntu-latest
    timeout-minutes: 150         # 🔧 v3: 60 se barha — retries waqt lete hain

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pyjwt cryptography google-cloud-bigquery python-dateutil
          fi

      - name: Run sync
        env:
          APPLE_KEY_ID:            ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID:         ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_PRIVATE_KEY:       ${{ secrets.APPLE_PRIVATE_KEY }}
          APPLE_VENDOR_NUMBER:     ${{ secrets.APPLE_VENDOR_NUMBER }}
          GCP_PROJECT:             ${{ secrets.GCP_PROJECT }}
          GCP_CREDENTIALS_JSON:    ${{ secrets.GCP_CREDENTIALS_JSON }}
          #    spartans        → apple_store_data
          #    terafort_us     → apple_console_terafort_us
          BQ_DATASET:              ${{ vars.BQ_DATASET || 'apple_store_data' }}
          SALES_LOOKBACK_DAYS:     ${{ github.event.inputs.sales_lookback_days || '7' }}
          FINANCE_LOOKBACK_MONTHS: ${{ github.event.inputs.finance_lookback_months || '3' }}
          # 🆕 v3: retry tuning bina code chhue
          HTTP_RETRIES:            ${{ github.event.inputs.http_retries || '3' }}
          HTTP_BACKOFF:            '5'
          SEGMENT_TIMEOUT:         ${{ github.event.inputs.segment_timeout || '300' }}
          API_TIMEOUT:             '60'
        run: python apple_to_bigquery.py

      # Health check — ab freshness bhi, sirf row count nahi
      - name: Health check
        if: always()
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_PROJECT:          ${{ secrets.GCP_PROJECT }}
          BQ_DATASET:           ${{ vars.BQ_DATASET || 'apple_store_data' }}
        run: |
          echo "$GCP_CREDENTIALS_JSON" > /tmp/gcp.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp.json
          python - <<'EOF'
          import os
          from google.cloud import bigquery
          bq = bigquery.Client(project=os.environ["GCP_PROJECT"])
          ds = f'{os.environ["GCP_PROJECT"]}.{os.environ["BQ_DATASET"]}'
          print(f"\n── {ds} " + "─"*40)

          DATED = {
              "sales_daily":                    "date",
              "analytics_installs":             "date",
              "analytics_sessions":             "date",
              "analytics_app_store_downloads":  "date",
              "analytics_app_store_discovery":  "date",
          }

          for t, col in DATED.items():
              try:
                  r = list(bq.query(
                      f"SELECT COUNT(*) n, CAST(MAX({col}) AS STRING) last_dt, "
                      f"DATE_DIFF(CURRENT_DATE(), MAX({col}), DAY) stale "
                      f"FROM `{ds}.{t}`").result())[0]
                  mark = "OK " if (r.stale is not None and r.stale <= 4) else "OLD"
                  print(f"   [{mark}] {t:<32} {r.n:>10,} rows · last {r.last_dt} "
                        f"({r.stale}d)")
              except Exception as e:
                  print(f"   [MISS] {t:<32} {type(e).__name__}")

          try:
              r = list(bq.query(f"SELECT COUNT(*) n FROM `{ds}.finance_monthly`").result())[0]
              print(f"   [OK ] {'finance_monthly':<32} {r.n:>10,} rows")
          except Exception:
              print(f"   [MISS] finance_monthly")

          # apps_dim ka bundle coverage — app_master_v2.ios_bundle_id ke liye lazmi
          try:
              q = f"""SELECT COUNT(*) apps,
                             COUNTIF(bundle_id IS NOT NULL AND TRIM(bundle_id)!='') bundles,
                             CAST(MAX(_loaded_at) AS STRING) last_load
                      FROM `{ds}.apps_dim`"""
              r = list(bq.query(q).result())[0]
              print(f"\n   apps_dim: {r.apps} apps · bundle_id bhara {r.bundles}/{r.apps}")
              print(f"   aakhri load: {r.last_load}")
              if r.bundles < r.apps:
                  print("   ⚠️  kuch apps par bundle_id khaali hai")
          except Exception as e:
              print(f"\n   🔴 apps_dim NAHI BANI — {type(e).__name__}")
              print("      → API key ka role check karein:")
              print("        App Store Connect → Users and Access → Integrations")
              print("        → Keys → role 'App Manager' ya 'Admin' hona chahiye")
              print("        ('Sales and Reports' role /v1/apps parh nahi sakta)")

          print("\n   NOTE: v4 mein exit code 1 ka matlab 'kuch app/table chhoot gaye'")
          print("         hai — 'kuch load nahi hua' NAHI. Upar ke counts dekhein.")
          EOF

  # ═══════════════════════════════════════════════════════════════════════
  #  KEEPALIVE — 60-din wala auto-disable rokta hai
  #     Koi third-party action nahi (org policy blocks) — seedha git.
  # ═══════════════════════════════════════════════════════════════════════
  keepalive:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'     # manual run par shor na machaye
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                    # git log ke liye poori history

      - name: Keepalive commit (sirf agar 45 din se koi commit nahi)
        run: |
          set -euo pipefail
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "aakhri commit ko $DAYS din huye"

          if [ "$DAYS" -lt 45 ]; then
            echo "✅ 45 din se kam — commit ki zaroorat nahi"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git add .keepalive
          git commit -m "chore(keepalive): workflow ko zinda rakhne ke liye [skip ci]"
          git push
          echo "✅ keepalive commit ho gaya — agle 60 din mehfooz"
